[package]
name = "ot-commissioner-cli"
description = "A faithful Rust port of the C++ ot-commissioner CLI, built on Mesh Five-O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Keep the installed binary name identical to the previous `--features cli` build.
[[bin]]
name = "ot-commissioner-rs"
path = "src/main.rs"
# This compatibility CLI is executable-facing and has no standalone rustdoc surface.
doc = false

[dependencies]
mesh50.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
mesh50 = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

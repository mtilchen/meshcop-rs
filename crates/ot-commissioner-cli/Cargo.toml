[package]
name = "ot-commissioner-cli"
description = "The ot-commissioner-rs interactive REPL: a faithful reimplementation of the C++ ot-commissioner CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Keep the installed binary name identical to the previous `--features cli` build.
[[bin]]
name = "ot-commissioner-rs"
path = "src/main.rs"
# Its normalized rustdoc name collides with the library crate in workspace docs.
doc = false

[dependencies]
ot-commissioner-rs.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
ot-commissioner-rs = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[package]
name = "meshcop-dtls"
description = "Runtime-neutral DTLS 1.2 profile for MeshCoP for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["tokio"]
std = ["dep:hex", "rand_core/getrandom"]
tokio = [
    "std",
    "dep:embedded-hal-async",
    "dep:embedded-io",
    "dep:embedded-nal-async",
    "dep:tokio",
]
# Runtime-neutral async UDP and delay traits used by Embassy and other
# embedded executors. The protocol remains no_std + alloc.
embedded = ["dep:embedded-hal-async", "dep:embedded-nal-async"]
# In-process loopback DTLS server for deterministic handshake tests. Unstable
# test scaffolding for this workspace's suites; not a supported public API.
test-support = ["tokio"]

[dependencies]
aes.workspace = true
ccm.workspace = true
embedded-hal-async = { version = "1.0.0", optional = true }
embedded-io = { version = "0.7.1", features = ["std"], optional = true }
embedded-nal-async = { version = "0.9.0", optional = true }
hex = { workspace = true, optional = true }
hmac.workspace = true
p256.workspace = true
rand_core.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
zeroize.workspace = true
